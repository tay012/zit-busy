<style>
  :root{
    --bg:#ffffff;
    --bg-2:#f7f7f8;
    --text:#161719;
    --text-2:#6b6f76;
    --line:#e6e7ea;
    --brand:#1F6F5C;      /* deep green — not DoorDash red, not Uber black */
    --quiet:#2E8B72;
    --moderate:#C98A1B;
    --packed:#D0483A;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  /* ============ TOP BAR ============ */
  .bar{
    position:sticky;top:0;z-index:30;background:var(--bg);
    padding:12px 16px 10px;border-bottom:1px solid var(--line);
  }
  .loc{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;}
  .loc svg{width:16px;height:16px;fill:var(--brand);}
  .loc span.city{font-weight:700;}
  .loc .chev{margin-left:2px;opacity:.45;}
  .search{
    margin-top:10px;background:var(--bg-2);border-radius:999px;
    display:flex;align-items:center;gap:9px;padding:11px 15px;
    color:var(--text-2);font-size:14.5px;
  }
  .search svg{width:16px;height:16px;fill:var(--text-2);flex-shrink:0;}

  /* ============ CATEGORY RAIL ============ */
  .rail{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;border:1px solid var(--line);background:var(--bg);
    border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;
    color:var(--text);display:flex;align-items:center;gap:6px;
    transition:background .15s,border-color .15s,color .15s;
  }
  .chip[aria-pressed="true"]{background:var(--text);color:#fff;border-color:var(--text);}
  .chip .dot{width:7px;height:7px;border-radius:50%;}

  /* ============ SECTION ============ */
  .sec{padding:6px 16px 4px;}
  .sec h2{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .sec p{font-size:13.5px;color:var(--text-2);margin-top:2px;}

  /* ============ CARDS ============ */
  .feed{padding:8px 16px 90px;display:grid;gap:22px;}
  .card{display:block;width:100%;text-align:left;background:none;border:0;padding:0;}
  .photo{
    position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;
    overflow:hidden;background:var(--bg-2);
  }
  .photo .ph{position:absolute;inset:0;}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .pill{
    position:absolute;left:10px;bottom:10px;
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-radius:999px;padding:6px 11px;
    font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;
    box-shadow:0 1px 4px rgba(0,0,0,.14);
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;}
  .pill .sub{font-weight:500;color:var(--text-2);}
  .fav{
    position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.92);border:0;display:grid;place-items:center;
  }
  .fav svg{width:16px;height:16px;fill:none;stroke:var(--text);stroke-width:2;}
  .fav[aria-pressed="true"] svg{fill:var(--packed);stroke:var(--packed);}

  .info{padding-top:10px;}
  .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .title{font-size:16.5px;font-weight:700;letter-spacing:-.01em;}
  .rating{
    flex-shrink:0;font-size:13px;font-weight:600;color:var(--text-2);
    display:flex;align-items:center;gap:3px;
  }
  .rating svg{width:12px;height:12px;fill:var(--text);}
  .row2{font-size:13.5px;color:var(--text-2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;}
  .row2 .sep{opacity:.4;}
  .wait{margin-top:7px;font-size:13px;font-weight:600;}

  .empty{
    grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;
    padding:40px 20px;text-align:center;color:var(--text-2);font-size:14px;line-height:1.5;
  }

  /* ============ DETAIL ============ */
  .detail{
    position:fixed;inset:0;background:var(--bg);z-index:60;
    max-width:520px;margin:0 auto;overflow-y:auto;
    transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  }
  .detail.on{transform:none;}
  @media (prefers-reduced-motion:reduce){.detail{transition:none;}}
  .hero{position:relative;width:100%;aspect-ratio:16/9;background:var(--bg-2);}
  .hero .ph{position:absolute;inset:0;}
  .back{
    position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.95);border:0;display:grid;place-items:center;
    box-shadow:0 1px 4px rgba(0,0,0,.16);
  }
  .back svg{width:17px;height:17px;fill:none;stroke:var(--text);stroke-width:2.2;}
  .dhead{padding:16px;border-bottom:8px solid var(--bg-2);}
  .dhead h1{font-size:25px;font-weight:800;letter-spacing:-.025em;}
  .dmeta{font-size:13.5px;color:var(--text-2);margin-top:5px;}
  .status{
    margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;
    display:flex;align-items:center;gap:12px;
  }
  .status .big{font-size:16px;font-weight:800;}
  .status .note{font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.4;}
  .bars{display:flex;gap:2.5px;align-items:flex-end;height:34px;margin-left:auto;flex-shrink:0;}
  .bars i{width:4.5px;border-radius:2px;background:var(--line);display:block;}
  .bars i.on{background:currentColor;}
  .bars i.now{outline:1.5px solid var(--text);outline-offset:1px;}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:16px;}
  .btn{
    border-radius:11px;padding:14px;font-size:14.5px;font-weight:700;
    border:1px solid var(--line);background:var(--bg);color:var(--text);
  }
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);}

  .menu{padding:0 16px 40px;}
  .menu h3{
    font-size:17px;font-weight:800;letter-spacing:-.015em;
    padding:20px 0 4px;position:sticky;top:0;background:var(--bg);
  }
  .item{
    display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);
    align-items:flex-start;
  }
  .item .t{flex:1;}
  .item .n{font-size:15px;font-weight:600;}
  .item .d{font-size:13px;color:var(--text-2);margin-top:3px;line-height:1.45;}
  .item .p{font-size:14px;font-weight:600;margin-top:6px;}
  .item .thumb{
    width:78px;height:78px;border-radius:9px;flex-shrink:0;background:var(--bg-2);
    position:relative;overflow:hidden;
  }

  /* ============ REPORT SHEET ============ */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:none;align-items:flex-end;justify-content:center;}
  .scrim.on{display:flex;}
  .sheet{
    background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;
    padding:22px 16px calc(20px + env(safe-area-inset-bottom));
    animation:rise .22s cubic-bezier(.32,.72,0,1);
  }
  @keyframes rise{from{transform:translateY(16px)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none;}}
  .sheet h2{font-size:21px;font-weight:800;letter-spacing:-.02em;}
  .sheet p.s{font-size:14px;color:var(--text-2);margin-top:5px;}
  .opts{display:grid;gap:8px;margin-top:16px;}
  .opts button{
    display:flex;align-items:center;gap:11px;text-align:left;
    border:1px solid var(--line);background:var(--bg);border-radius:12px;
    padding:15px;font-size:15px;font-weight:600;color:var(--text);
  }
  .opts .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .opts small{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--text-2);}
  .cancel{width:100%;margin-top:12px;background:none;border:0;color:var(--text-2);font-size:14px;padding:11px;}
  .conf{margin-top:16px;background:var(--bg-2);border-radius:12px;padding:14px;font-size:14px;line-height:1.5;}
  .conf .n{font-size:12.5px;color:var(--text-2);margin-top:5px;}

  footer{padding:16px;font-size:11.5px;color:var(--text-2);line-height:1.6;border-top:1px solid var(--line);}
</style>
</head>

const CATS = ["All","Coffee","Bakery","Restaurants","Bars","Southern","Barbecue","Tacos","Deli"];

/* ================= scoring ================= */
const reports = {};
const TTL = 45*60*1000;
const LABEL = {quiet:"Not busy", moderate:"Steady", packed:"Packed"};
const WAITS = {quiet:"Walk right in", moderate:"Short wait", packed:"Expect a wait"};

function band(v){ return v<35?"quiet":v<68?"moderate":"packed"; }

function score(v){
  const d=new Date(), h=d.getHours(), f=d.getMinutes()/60;
  const a=v.curve[h], b=v.curve[(h+1)%24];
  let val = a + (b-a)*f;
  let src = "Based on typical patterns";
  const r = reports[v.name];
  if (r && Date.now()-r.at < TTL){
    const t = {quiet:20,moderate:50,packed:85}[r.level];
    const w = .85 * (1 - (Date.now()-r.at)/TTL);
    val = val*(1-w) + t*w;
    src = r.count + (r.count===1?" person":" people") + " reported this " + ago(r.at);
  }
  val = Math.max(0,Math.min(100,Math.round(val)));
  return {val, band:band(val), src};
}
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?"just now":m+" min ago";}

/* placeholder photo — replace by setting v.photo to an image URL */
function ph(v, seed){
  const h1=v.hue, h2=(v.hue+26)%360;
  return `<div class="ph" style="background:
    linear-gradient(135deg, hsl(${h1} 42% 76%) 0%, hsl(${h2} 38% 62%) 58%, hsl(${h1} 34% 48%) 100%)"></div>`;
}
function photoBlock(v){
  return v.photo ? `<img src="${v.photo}" alt="">` : ph(v);
}

/* ================= feed ================= */
let cat = "All", busyFilter = null;

function rail(){
  document.getElementById("rail").innerHTML = CATS.map(c =>
    `<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${c}</button>`).join("")
    + ["quiet","moderate","packed"].map(b =>
    `<button class="chip" data-b="${b}" aria-pressed="${b===busyFilter}"><span class="dot" style="background:var(--${b})"></span>${LABEL[b]}</button>`).join("");
}

function feed(){
  const all = VENUES.map(v=>({v,s:score(v)})).filter(x=>x.s.val>0);
  let list = all;
  if (cat!=="All") list = list.filter(x=>x.v.cat===cat);
  if (busyFilter) list = list.filter(x=>x.s.band===busyFilter);
  list.sort((a,b)=>b.s.val-a.s.val);

  document.getElementById("secTitle").textContent =
    busyFilter ? LABEL[busyFilter] + " right now" : (cat==="All" ? "Open near you" : cat);
  document.getElementById("secSub").textContent =
    list.length + " open · " + new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});

  document.getElementById("feed").innerHTML = list.length ? list.map(({v,s},i)=>`
    <button class="card" data-open="${v.name}">
      <div class="photo">
        ${photoBlock(v)}
        <span class="fav" role="presentation"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-9.3-9A5 5 0 0 1 12 6.2 5 5 0 0 1 21.3 12c-1.8 4.1-9.3 9-9.3 9z"/></svg></span>
        <span class="pill"><span class="dot" style="background:var(--${s.band})"></span>${LABEL[s.band]}<span class="sub">${s.val}%</span></span>
      </div>
      <div class="info">
        <div class="row1">
          <span class="title">${v.name}</span>
          <span class="rating"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .9-5 5 1.2 7-6.2-3.4L5.8 21.5 7 14.5l-5-5 7-.9z"/></svg>${v.rating}<span style="opacity:.6">(${(v.reviews/1000).toFixed(1)}k)</span></span>
        </div>
        <div class="row2">${v.cat}<span class="sep">·</span>${v.price}<span class="sep">·</span>${v.area}</div>
        <div class="wait" style="color:var(--${s.band})">${WAITS[s.band]}</div>
      </div>
    </button>`).join("")
    : `<div class="empty">Nothing here right now.<br>Try a different filter.</div>`;
}

/* ================= detail ================= */
function openDetail(name){
  const v = VENUES.find(x=>x.name===name); if(!v) return;
  const s = score(v);
  const nowH = new Date().getHours();
  const bars = v.curve.map((p,i)=>{
    const on = p>0;
    return `<i class="${on?"on":""} ${i===nowH?"now":""}" style="height:${Math.max(3,p*.34)}px"></i>`;
  }).join("");

  const d = document.getElementById("detail");
  d.innerHTML = `
    <div class="hero">${photoBlock(v)}
      <button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    </div>
    <div class="dhead">
      <h1>${v.name}</h1>
      <div class="dmeta">★ ${v.rating} (${v.reviews.toLocaleString()}) · ${v.cat} · ${v.price} · ${v.area}</div>
      <div class="status" style="color:var(--${s.band})">
        <div>
          <div class="big">${LABEL[s.band]} — ${s.val}% of peak</div>
          <div class="note">${s.src}</div>
        </div>
        <div class="bars">${bars}</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="book">Reserve a table</button>
      <button class="btn" data-report="${v.name}">I'm here now</button>
    </div>
    <div class="menu">
      ${v.menu.map(([sec,items])=>`
        <h3>${sec}</h3>
        ${items.map(([n,desc,p])=>`
          <div class="item">
            <div class="t">
              <div class="n">${n}</div>
              ${desc?`<div class="d">${desc}</div>`:""}
              <div class="p">$${p}</div>
            </div>
            <div class="thumb">${ph(v)}</div>
          </div>`).join("")}
      `).join("")}
    </div>`;
  d.classList.add("on");
  document.body.style.overflow="hidden";
  d.scrollTop = 0;
  document.getElementById("back").onclick = closeDetail;
  document.getElementById("book").onclick = () =>
    alert("Booking connects once the OpenTable partner integration is approved.");
}
function closeDetail(){
  document.getElementById("detail").classList.remove("on");
  document.body.style.overflow="";
}

/* ================= report ================= */
const scrim = document.getElementById("scrim");
const OPTS = [["quiet","Not busy","Seats available"],["moderate","Steady","Filling up"],["packed","Packed","There's a wait"]];
let target=null;

function openSheet(name){
  target=name;
  document.getElementById("sheet").innerHTML = `
    <h2>How busy is it?</h2>
    <p class="s">At ${name} — what does it look like right now?</p>
    <div class="opts">${OPTS.map(([k,t,d])=>
      `<button data-k="${k}"><span class="dot" style="background:var(--${k})"></span>${t}<small>${d}</small></button>`).join("")}
    </div>
    <button class="cancel" data-close>Not right now</button>`;
  scrim.classList.add("on");
}
function closeSheet(){scrim.classList.remove("on");target=null;}

scrim.addEventListener("click",e=>{
  if(e.target===scrim || e.target.hasAttribute("data-close")) return closeSheet();
  const b=e.target.closest("button[data-k]"); if(!b||!target) return;
  const prev=reports[target], fresh=prev && Date.now()-prev.at<TTL;
  reports[target]={level:b.dataset.k,at:Date.now(),
    count: fresh && prev.level===b.dataset.k ? prev.count+1 : 1};
  const r=reports[target];
  document.getElementById("sheet").innerHTML=`
    <h2>Thanks</h2>
    <p class="s">That updates ${target} for everyone looking right now.</p>
    <div class="conf">Now showing <b style="color:var(--${r.level})">${LABEL[r.level]}</b>
      <div class="n">${r.count} ${r.count===1?"person has":"people have"} said this in the last 45 minutes</div>
    </div>
    <button class="cancel" data-close>Close</button>`;
  const t=target;
  feed();
  if(document.getElementById("detail").classList.contains("on")){
    const sc=document.getElementById("detail").scrollTop;
    openDetail(t);
    document.getElementById("detail").scrollTop=sc;
  }
});

/* ================= events ================= */
document.getElementById("rail").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  if(b.dataset.c) cat = b.dataset.c;
  if(b.dataset.b) busyFilter = busyFilter===b.dataset.b ? null : b.dataset.b;
  rail(); feed();
});
document.getElementById("feed").addEventListener("click",e=>{
  const c=e.target.closest("[data-open]"); if(c) openDetail(c.dataset.open);
});
document.getElementById("detail").addEventListener("click",e=>{
  const r=e.target.closest("[data-report]"); if(r) openSheet(r.dataset.report);
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(scrim.classList.contains("on")) closeSheet();
  else closeDetail();
});

rail(); feed();
setInterval(()=>{ if(!scrim.classList.contains("on")) feed(); },60000);
</script>
</body>
</html>
