<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Right Now RVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg-2:#f7f7f8; --text:#161719; --text-2:#6b6f76;
    --line:#e6e7ea; --brand:#1F6F5C;
    --quiet:#2E8B72; --moderate:#C98A1B; --packed:#D0483A;
    --pill-bg:rgba(255,255,255,.96); --pill-fg:#161719;
    --chipimg:.85; --scrim:rgba(0,0,0,.4);
  }
  html[data-theme="dark"]{
    --bg:#0F1115; --bg-2:#171A20; --text:#EDEEF0; --text-2:#9AA1AC;
    --line:#262A32; --brand:#3FA98C;
    --quiet:#4FBF9E; --moderate:#E0A93F; --packed:#E8695A;
    --pill-bg:rgba(20,22,26,.92); --pill-fg:#EDEEF0;
    --chipimg:.78; --scrim:rgba(0,0,0,.62);
  }
  html{color-scheme:light;}
  html[data-theme="dark"]{color-scheme:dark;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  /* ---------- top bar ---------- */
  .bar{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line);}
  .loc{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;}
  .loc svg{width:16px;height:16px;fill:var(--brand);}
  .loc .chev{margin-left:2px;opacity:.45;}
  .theme{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--bg-2);display:grid;place-items:center;padding:0;flex-shrink:0;}
  .theme svg{width:17px;height:17px;fill:var(--text);}
  .search{margin-top:10px;background:var(--bg-2);border-radius:999px;display:flex;align-items:center;gap:9px;padding:11px 15px;color:var(--text-2);font-size:14.5px;}
  .search svg{width:16px;height:16px;fill:var(--text-2);flex-shrink:0;}

  /* ---------- rail ---------- */
  .rail{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s;}
  .chip[aria-pressed="true"]{background:var(--text);color:#fff;border-color:var(--text);}
  .chip .dot{width:7px;height:7px;border-radius:50%;}
  .chip.filters{border-color:var(--text);font-weight:700;}
  .chip.filters svg{width:14px;height:14px;fill:currentColor;}
  .chip.filters .badge{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;font-weight:700;}
  .chip.filters[data-active="true"]{background:var(--brand);color:#fff;border-color:var(--brand);}
  .chip.filters[data-active="true"] .badge{background:rgba(255,255,255,.25);}

  /* ---------- section ---------- */
  .sec{padding:6px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .sec h2{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .sec .cnt{font-size:13px;color:var(--text-2);flex-shrink:0;}

  /* ---------- cards ---------- */
  .feed{padding:8px 16px 90px;display:grid;gap:22px;}
  .divider{display:flex;align-items:center;gap:11px;color:var(--text-2);font-size:13px;font-weight:600;margin-top:6px;}
  .divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .card{display:block;width:100%;text-align:left;background:none;border:0;padding:0;}
  .photo{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--bg-2);}
  .photo .ph{position:absolute;inset:0;}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card.shut .photo .ph,.card.shut .photo img{filter:grayscale(.85) brightness(var(--chipimg));}
  .pill{position:absolute;left:10px;bottom:10px;background:var(--pill-bg);color:var(--pill-fg);backdrop-filter:blur(8px);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.14);}
  .pill .dot{width:8px;height:8px;border-radius:50%;}
  .pill .sub{font-weight:500;color:var(--text-2);}
  .pill.shut{background:rgba(12,14,17,.92);color:#fff;}
  .fav{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:var(--pill-bg);border:0;display:grid;place-items:center;}
  .fav svg{width:16px;height:16px;fill:none;stroke:var(--pill-fg);stroke-width:2;}

  .info{padding-top:10px;}
  .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .title{font-size:16.5px;font-weight:700;letter-spacing:-.01em;}
  .card.shut .title{color:var(--text-2);}
  .rating{flex-shrink:0;font-size:13px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:3px;}
  .rating svg{width:12px;height:12px;fill:var(--text);}
  .row2{font-size:13.5px;color:var(--text-2);margin-top:3px;}
  .row2 .sep{opacity:.4;margin:0 5px;}
  .wait{margin-top:7px;font-size:13px;font-weight:600;}
  .shutline{margin-top:7px;font-size:13px;color:var(--text-2);line-height:1.45;}
  .shutline b{color:var(--text);font-weight:700;}

  .empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--text-2);font-size:14px;line-height:1.5;}
  .empty button{margin-top:12px;background:var(--text);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:600;}

  /* ---------- filter panel ---------- */
  .panel{position:fixed;inset:0;z-index:70;display:none;}
  .panel.on{display:block;}
  .panel .bg{position:absolute;inset:0;background:var(--scrim);}
  .panel .box{
    position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
    background:var(--bg);border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;
    animation:rise .24s cubic-bezier(.32,.72,0,1);
  }
  @keyframes rise{from{transform:translateY(20px)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){.panel .box{animation:none;}}
  .phead{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 14px;border-bottom:1px solid var(--line);}
  .phead h2{font-size:19px;font-weight:800;letter-spacing:-.02em;}
  .phead .x{background:none;border:0;font-size:22px;line-height:1;color:var(--text-2);padding:2px 6px;}
  .pbody{overflow-y:auto;padding:4px 16px 16px;}
  .grp{padding:18px 0 4px;border-bottom:1px solid var(--line);}
  .grp:last-child{border-bottom:0;}
  .grp h3{font-size:14px;font-weight:700;margin-bottom:11px;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px;}
  .opt[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand);}
  .opt .dot{width:8px;height:8px;border-radius:50%;}
  .opt[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.6);}
  .toggle{display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px;}
  .toggle span{font-size:14.5px;font-weight:600;}
  .toggle small{display:block;font-size:12.5px;color:var(--text-2);font-weight:400;margin-top:2px;}
  .sw{width:48px;height:28px;border-radius:999px;background:var(--line);border:0;position:relative;flex-shrink:0;transition:background .18s;}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s;}
  .sw[aria-pressed="true"]{background:var(--brand);}
  .sw[aria-pressed="true"]::after{transform:translateX(20px);}
  .pfoot{display:flex;gap:9px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .pfoot button{flex:1;border-radius:11px;padding:14px;font-size:14.5px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--text);}
  .pfoot .apply{flex:2;background:var(--brand);color:#fff;border-color:var(--brand);}

  /* ---------- detail ---------- */
  .detail{position:fixed;inset:0;background:var(--bg);z-index:60;max-width:520px;margin:0 auto;overflow-y:auto;transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);}
  .detail.on{transform:none;}
  @media (prefers-reduced-motion:reduce){.detail{transition:none;}}
  .hero{position:relative;width:100%;aspect-ratio:16/9;background:var(--bg-2);}
  .hero .ph{position:absolute;inset:0;}
  .hero.shut .ph{filter:grayscale(.85) brightness(var(--chipimg));}
  .back{position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--pill-bg);border:0;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.24);}
  .back svg{width:17px;height:17px;fill:none;stroke:var(--pill-fg);stroke-width:2.2;}
  .dhead{padding:16px;border-bottom:8px solid var(--bg-2);}
  .dhead h1{font-size:25px;font-weight:800;letter-spacing:-.025em;}
  .dmeta{font-size:13.5px;color:var(--text-2);margin-top:5px;}
  .status{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;}
  .status .big{font-size:16px;font-weight:800;}
  .status .note{font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.45;}
  .bars{display:flex;gap:2.5px;align-items:flex-end;height:34px;margin-left:auto;flex-shrink:0;}
  .bars i{width:4.5px;border-radius:2px;background:var(--line);display:block;}
  .bars i.on{background:currentColor;}
  .bars i.now{outline:1.5px solid var(--text);outline-offset:1px;}
  .hours{margin-top:12px;font-size:13px;color:var(--text-2);line-height:1.6;}
  .hours b{color:var(--text);font-weight:600;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:16px;}
  .btn{border-radius:11px;padding:14px;font-size:14.5px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--text);}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn[disabled]{opacity:.45;cursor:default;}
  .menu{padding:0 16px 40px;}
  .menu h3{font-size:17px;font-weight:800;letter-spacing:-.015em;padding:20px 0 4px;position:sticky;top:0;background:var(--bg);}
  .item{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
  .item .t{flex:1;}
  .item .n{font-size:15px;font-weight:600;}
  .item .d{font-size:13px;color:var(--text-2);margin-top:3px;line-height:1.45;}
  .item .p{font-size:14px;font-weight:600;margin-top:6px;}
  .item .thumb{width:78px;height:78px;border-radius:9px;flex-shrink:0;background:var(--bg-2);position:relative;overflow:hidden;}

  /* ---------- report sheet ---------- */
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;align-items:flex-end;justify-content:center;}
  .scrim.on{display:flex;}
  .sheet{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom));animation:rise .22s cubic-bezier(.32,.72,0,1);}
  .sheet h2{font-size:21px;font-weight:800;letter-spacing:-.02em;}
  .sheet p.s{font-size:14px;color:var(--text-2);margin-top:5px;}
  .ropts{display:grid;gap:8px;margin-top:16px;}
  .ropts button{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:15px;font-size:15px;font-weight:600;color:var(--text);}
  .ropts .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .ropts small{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--text-2);}
  .cancel{width:100%;margin-top:12px;background:none;border:0;color:var(--text-2);font-size:14px;padding:11px;}
  .conf{margin-top:16px;background:var(--bg-2);border-radius:12px;padding:14px;font-size:14px;line-height:1.5;}
  .conf .n{font-size:12.5px;color:var(--text-2);margin-top:5px;}

  footer{padding:16px;font-size:11.5px;color:var(--text-2);line-height:1.6;border-top:1px solid var(--line);}
</style>
</head>

let manual = null;
function systemDark(){return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;}
function isDark(){return manual===null ? systemDark() : manual==='dark';}
function paintTheme(){
  const d=isDark();
  document.documentElement.setAttribute('data-theme', d?'dark':'light');
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', d?'#0F1115':'#ffffff');
  const b=document.getElementById('themeBtn');
  if(b){ b.innerHTML = d?SUN:MOON; b.setAttribute('aria-label', d?'Switch to light mode':'Switch to dark mode'); }
}
paintTheme();
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(manual===null) paintTheme(); });
}

const CATS = ["All","Fast food","Coffee","Bakery","Restaurants","Bars","Southern","Barbecue","Tacos","Deli"];
const AREAS = [...new Set(V.map(v=>v.area))].sort();
const LABEL = {quiet:"Not busy", moderate:"Steady", packed:"Packed"};
const WAITS = {quiet:"Walk right in", moderate:"Short wait", packed:"Expect a wait"};
const PRICE = {1:"$",2:"$$",3:"$$$"};

/* ---------- filter state ---------- */
const F = {cat:"All", busy:[], price:[], area:[], rating:0, showClosed:true, openOnly:false};
let draft = null;

/* ---------- time helpers ---------- */
function nowH(){const d=new Date();return d.getHours()+d.getMinutes()/60;}
function isOpen(v,t=nowH()){
  if(v.close>24) return t>=v.open || t<(v.close-24);
  return t>=v.open && t<v.close;
}
function fmt(h){
  h=((h%24)+24)%24;
  const hr=Math.floor(h), m=Math.round((h-hr)*60);
  const ap=hr<12?"AM":"PM"; let d=hr%12; if(d===0)d=12;
  return m?`${d}:${String(m).padStart(2,"0")} ${ap}`:`${d} ${ap}`;
}
function opensIn(v){
  const t=nowH();
  let diff = v.open - t; if(diff<0) diff+=24;
  if(diff<1) return `Opens in ${Math.round(diff*60)} min`;
  if(diff<6) return `Opens at ${fmt(v.open)}`;
  return `Opens ${fmt(v.open)} tomorrow`;
}
/* typical busy window on reopen — reads from the venue's own curve */
function peakWindow(v){
  let best=-1,bi=0;
  v.curve.forEach((p,i)=>{if(p>best){best=p;bi=i;}});
  let s=bi,e=bi;
  while(s>0 && v.curve[s-1]>best*0.7) s--;
  while(e<23 && v.curve[e+1]>best*0.7) e++;
  return `Usually busiest ${fmt(s)}–${fmt(e+1)}`;
}

/* ---------- scoring ---------- */
const reports={}, TTL=45*60*1000;
function band(x){return x<35?"quiet":x<68?"moderate":"packed";}
function score(v){
  const d=new Date(),h=d.getHours(),f=d.getMinutes()/60;
  const a=v.curve[h],b=v.curve[(h+1)%24];
  let val=a+(b-a)*f, src="Based on typical patterns";
  const r=reports[v.name];
  if(r&&Date.now()-r.at<TTL){
    const tg={quiet:20,moderate:50,packed:85}[r.level];
    const w=.85*(1-(Date.now()-r.at)/TTL);
    val=val*(1-w)+tg*w;
    src=r.count+(r.count===1?" person":" people")+" reported this "+ago(r.at);
  }
  val=Math.max(0,Math.min(100,Math.round(val)));
  return {val,band:band(val),src};
}
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?"just now":m+" min ago";}
function ph(v){const a=v.hue,b=(v.hue+26)%360;
  return `<div class="ph" style="background:linear-gradient(135deg,hsl(${a} 42% 76%),hsl(${b} 38% 62%) 58%,hsl(${a} 34% 48%))"></div>`;}
function photoBlock(v){
  if(!v.photo) return ph(v);
  /* gradient sits underneath; if the image 404s or is blocked, it just shows through */
  return ph(v) + `<img src="${v.photo}" alt="" loading="lazy" onerror="this.remove()">`;
}

/* ---------- filtering ---------- */
function activeCount(){
  return F.busy.length + F.price.length + F.area.length + (F.rating?1:0) + (F.openOnly?1:0) + (F.showClosed?0:1);
}
function apply(){
  return V.map(v=>({v,s:score(v),open:isOpen(v)}))
    .filter(x=>{
      if(F.cat!=="All" && x.v.cat!==F.cat) return false;
      if(F.price.length && !F.price.includes(x.v.price)) return false;
      if(F.area.length && !F.area.includes(x.v.area)) return false;
      if(F.rating && x.v.rating < F.rating) return false;
      if(F.openOnly && !x.open) return false;
      if(!F.showClosed && !x.open) return false;
      if(F.busy.length){ if(!x.open) return false; if(!F.busy.includes(x.s.band)) return false; }
      return true;
    })
    .sort((a,b)=> (b.open-a.open) || (b.s.val-a.s.val));
}

/* ---------- rail ---------- */
function rail(){
  const n=activeCount();
  document.getElementById("rail").innerHTML =
    `<button class="chip filters" id="openFilters" data-active="${n>0}">
       <svg viewBox="0 0 24 24"><path d="M3 5h18v2l-7 7v6l-4-2v-4L3 7z"/></svg>Filters${n?`<span class="badge">${n}</span>`:""}
     </button>` +
    CATS.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===F.cat}">${c}</button>`).join("");
}

/* ---------- feed ---------- */
function feed(){
  const list=apply();
  const open=list.filter(x=>x.open), shut=list.filter(x=>!x.open);
  document.getElementById("secTitle").textContent = F.cat==="All"?"Near you":F.cat;
  document.getElementById("secCnt").textContent =
    `${open.length} open · ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}`;

  const card = ({v,s,open}) => `
    <button class="card ${open?"":"shut"}" data-open="${v.name}">
      <div class="photo">${photoBlock(v)}
        <span class="fav"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-9.3-9A5 5 0 0 1 12 6.2 5 5 0 0 1 21.3 12c-1.8 4.1-9.3 9-9.3 9z"/></svg></span>
        ${open
          ? `<span class="pill"><span class="dot" style="background:var(--${s.band})"></span>${LABEL[s.band]}<span class="sub">${s.val}%</span></span>`
          : `<span class="pill shut">Closed</span>`}
      </div>
      <div class="info">
        <div class="row1"><span class="title">${v.name}</span>
          <span class="rating"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .9-5 5 1.2 7-6.2-3.4L5.8 21.5 7 14.5l-5-5 7-.9z"/></svg>${v.rating}<span style="opacity:.6">(${(v.reviews/1000).toFixed(1)}k)</span></span>
        </div>
        <div class="row2">${v.cat}<span class="sep">·</span>${PRICE[v.price]}<span class="sep">·</span>${v.area}</div>
        ${open
          ? `<div class="wait" style="color:var(--${s.band})">${WAITS[s.band]}</div>`
          : `<div class="shutline"><b>${opensIn(v)}</b><br>${peakWindow(v)}</div>`}
      </div>
    </button>`;

  const el=document.getElementById("feed");
  if(!list.length){
    el.innerHTML=`<div class="empty">Nothing matches these filters.<br><button id="clearInline">Clear filters</button></div>`;
    document.getElementById("clearInline").onclick=()=>{clear();rail();feed();};
    return;
  }
  el.innerHTML = open.map(card).join("")
    + (shut.length && !F.openOnly ? `<div class="divider">Closed right now</div>` + shut.map(card).join("") : "");
}

/* ---------- filter panel ---------- */
function clear(){F.busy=[];F.price=[];F.area=[];F.rating=0;F.openOnly=false;F.showClosed=true;}

function panelBody(){
  const d=draft;
  const tog=(arr,val)=>arr.includes(val);
  document.getElementById("pbody").innerHTML=`
    <div class="grp"><h3>How busy</h3><div class="opts">
      ${["quiet","moderate","packed"].map(b=>
        `<button class="opt" data-t="busy" data-v="${b}" aria-pressed="${tog(d.busy,b)}"><span class="dot" style="background:var(--${b})"></span>${LABEL[b]}</button>`).join("")}
    </div></div>

    <div class="grp"><h3>Price</h3><div class="opts">
      ${[1,2,3].map(p=>`<button class="opt" data-t="price" data-v="${p}" aria-pressed="${tog(d.price,p)}">${PRICE[p]}</button>`).join("")}
    </div></div>

    <div class="grp"><h3>Rating</h3><div class="opts">
      ${[4.0,4.5,4.7].map(r=>`<button class="opt" data-t="rating" data-v="${r}" aria-pressed="${d.rating===r}">★ ${r.toFixed(1)}+</button>`).join("")}
    </div></div>

    <div class="grp"><h3>Neighborhood</h3><div class="opts">
      ${AREAS.map(a=>`<button class="opt" data-t="area" data-v="${a}" aria-pressed="${tog(d.area,a)}">${a}</button>`).join("")}
    </div></div>

    <div class="grp">
      <div class="toggle"><span>Open now only<small>Hide everything that's closed</small></span>
        <button class="sw" data-t="openOnly" aria-pressed="${d.openOnly}" aria-label="Open now only"></button></div>
      <div class="toggle"><span>Show closed places<small>Listed below with opening times</small></span>
        <button class="sw" data-t="showClosed" aria-pressed="${d.showClosed}" aria-label="Show closed places"></button></div>
    </div>`;
  const n=draft.busy.length+draft.price.length+draft.area.length+(draft.rating?1:0)+(draft.openOnly?1:0)+(draft.showClosed?0:1);
  const saved=JSON.parse(JSON.stringify(F)); Object.assign(F,draft);
  const c=apply().length; Object.assign(F,saved);
  document.getElementById("applyBtn").textContent = c?`Show ${c} place${c===1?"":"s"}`:"No matches";
}

function openPanel(){draft=JSON.parse(JSON.stringify(F));panelBody();document.getElementById("panel").classList.add("on");document.body.style.overflow="hidden";}
function closePanel(){document.getElementById("panel").classList.remove("on");document.body.style.overflow="";}

document.getElementById("panel").addEventListener("click",e=>{
  if(e.target.closest("[data-close-panel]")) return closePanel();
  const b=e.target.closest("[data-t]"); if(!b) return;
  const t=b.dataset.t;
  if(t==="busy"||t==="area"){const a=draft[t],x=b.dataset.v;const i=a.indexOf(x);i<0?a.push(x):a.splice(i,1);}
  else if(t==="price"){const a=draft.price,x=+b.dataset.v;const i=a.indexOf(x);i<0?a.push(x):a.splice(i,1);}
  else if(t==="rating"){const x=+b.dataset.v;draft.rating = draft.rating===x?0:x;}
  else if(t==="openOnly"){draft.openOnly=!draft.openOnly; if(draft.openOnly) draft.showClosed=false;}
  else if(t==="showClosed"){draft.showClosed=!draft.showClosed; if(draft.showClosed) draft.openOnly=false;}
  panelBody();
});
document.getElementById("applyBtn").onclick=()=>{Object.assign(F,draft);closePanel();rail();feed();};
document.getElementById("clearAll").onclick=()=>{draft={cat:draft.cat,busy:[],price:[],area:[],rating:0,showClosed:true,openOnly:false};panelBody();};

/* ---------- detail ---------- */
function openDetail(name){
  const v=V.find(x=>x.name===name); if(!v) return;
  const s=score(v), op=isOpen(v), h=new Date().getHours();
  const bars=v.curve.map((p,i)=>`<i class="${p>0?"on":""} ${i===h?"now":""}" style="height:${Math.max(3,p*.34)}px"></i>`).join("");
  const d=document.getElementById("detail");
  d.innerHTML=`
    <div class="hero ${op?"":"shut"}">${photoBlock(v)}
      <button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></div>
    <div class="dhead">
      <h1>${v.name}</h1>
      <div class="dmeta">★ ${v.rating} (${v.reviews.toLocaleString()}) · ${v.cat} · ${PRICE[v.price]} · ${v.area}</div>
      <div class="status" style="color:var(--${op?s.band:"text-2"})">
        <div>
          <div class="big">${op?`${LABEL[s.band]} — ${s.val}% of peak`:"Closed right now"}</div>
          <div class="note">${op?s.src:`${opensIn(v)} · ${peakWindow(v)}`}</div>
        </div>
        <div class="bars">${bars}</div>
      </div>
      <div class="hours">Hours today: <b>${fmt(v.open)} – ${fmt(v.close)}</b></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="book">Reserve a table</button>
      <button class="btn" data-report="${v.name}" ${op?"":"disabled"}>${op?"I'm here now":"Closed"}</button>
    </div>
    <div class="menu">${v.menu.map(([sec,items])=>`<h3>${sec}</h3>`+items.map(([n,ds,p])=>`
      <div class="item"><div class="t"><div class="n">${n}</div>${ds?`<div class="d">${ds}</div>`:""}<div class="p">$${p}</div></div>
      <div class="thumb">${ph(v)}</div></div>`).join("")).join("")}</div>`;
  d.classList.add("on"); document.body.style.overflow="hidden"; d.scrollTop=0;
  document.getElementById("back").onclick=closeDetail;
  document.getElementById("book").onclick=()=>alert("Booking connects once the OpenTable partner integration is approved.");
}
function closeDetail(){document.getElementById("detail").classList.remove("on");document.body.style.overflow="";}

/* ---------- report ---------- */
const scrim=document.getElementById("scrim");
const OPTS=[["quiet","Not busy","Seats available"],["moderate","Steady","Filling up"],["packed","Packed","There's a wait"]];
let target=null;
function openSheet(n){target=n;
  document.getElementById("sheet").innerHTML=`<h2>How busy is it?</h2><p class="s">At ${n} — what does it look like right now?</p>
    <div class="ropts">${OPTS.map(([k,t,dd])=>`<button data-k="${k}"><span class="dot" style="background:var(--${k})"></span>${t}<small>${dd}</small></button>`).join("")}</div>
    <button class="cancel" data-close>Not right now</button>`;
  scrim.classList.add("on");}
function closeSheet(){scrim.classList.remove("on");target=null;}
scrim.addEventListener("click",e=>{
  if(e.target===scrim||e.target.hasAttribute("data-close")) return closeSheet();
  const b=e.target.closest("button[data-k]"); if(!b||!target) return;
  const p=reports[target], fresh=p&&Date.now()-p.at<TTL;
  reports[target]={level:b.dataset.k,at:Date.now(),count:fresh&&p.level===b.dataset.k?p.count+1:1};
  const r=reports[target], t=target;
  document.getElementById("sheet").innerHTML=`<h2>Thanks</h2><p class="s">That updates ${t} for everyone looking right now.</p>
    <div class="conf">Now showing <b style="color:var(--${r.level})">${LABEL[r.level]}</b>
      <div class="n">${r.count} ${r.count===1?"person has":"people have"} said this in the last 45 minutes</div></div>
    <button class="cancel" data-close>Close</button>`;
  feed();
  const dt=document.getElementById("detail");
  if(dt.classList.contains("on")){const sc=dt.scrollTop;openDetail(t);dt.scrollTop=sc;}
});

/* ---------- events ---------- */
document.getElementById("rail").addEventListener("click",e=>{
  if(e.target.closest("#openFilters")) return openPanel();
  const b=e.target.closest(".chip[data-c]"); if(!b) return;
  F.cat=b.dataset.c; rail(); feed();
});
document.getElementById("feed").addEventListener("click",e=>{
  const c=e.target.closest("[data-open]"); if(c) openDetail(c.dataset.open);
});
document.getElementById("detail").addEventListener("click",e=>{
  const r=e.target.closest("[data-report]"); if(r&&!r.disabled) openSheet(r.dataset.report);
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(scrim.classList.contains("on"))closeSheet();
  else if(document.getElementById("panel").classList.contains("on"))closePanel();
  else closeDetail();
});

document.getElementById('themeBtn').onclick=()=>{ manual = isDark()?'light':'dark'; paintTheme(); };

rail(); feed(); paintTheme();
setInterval(()=>{if(!scrim.classList.contains("on")&&!document.getElementById("panel").classList.contains("on"))feed();},60000);
</script>
</body>
</html>
